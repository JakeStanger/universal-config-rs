[package]
name = "universal-config"
version = "0.5.0"
edition = "2021"
description = "A library to simplify reading configuration files from various file formats."
license = "MIT"
keywords = ["config", "serde"]

[features]
default = ["json", "yaml", "toml", "corn", "xml", "ron", "kdl"]

# aliases
# toml does not need to be explicitly included as the dep provides a feature
json = ["dep:serde_json", "save"]
yaml = ["dep:serde_yaml", "save"]
corn = ["dep:libcorn"]
xml = ["dep:serde-xml-rs", "save"]
ron = ["dep:ron", "save"]
kdl = ["dep:kaydle"]

save = []

[dependencies]
serde = "1.0.219"
dirs = "6.0.0"
thiserror = "2.0.12"
tracing = "0.1.41"

# optional
serde_json = { version = "1.0.140", optional = true }
serde_yaml = { version = "0.9.34", optional = true }
toml = { version = "0.8.20", optional = true }
libcorn = { version = "0.10.0", optional = true }
serde-xml-rs = { version = "0.6.0", optional = true }
ron = { version = "0.10.1", optional = true }
kaydle = { version = "0.2.0", optional = true }